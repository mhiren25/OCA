# 0001-fw-order-multi
#
# 7 order(s) found by reading the table columns.
#
# EDIT THIS FILE. NOTHING ELSE. Then:
#     python scripts/build_fixture.py corpus/fixtures/0001-fw-order-multi
#
# 1. COUNT THE ORDERS FIRST. Add or delete `orders:` entries until there
#    is exactly one per order the client gave. Line recall is a hard 100%
#    gate, so a missing entry lowers the bar instead of failing loudly.
# 2. Copy values from the email VERBATIM. build_fixture.py finds each one
#    in the body to derive its offsets — a paraphrase will not be found.
# 3. Leave a field blank if the client did not state it. Blank is a real
#    answer (Unresolved), not an omission.
# 4. Tags must come from corpus/schema/tags.yaml.
#
# NOTE: header: 'Trade date\tOrders\tSecurity\tTicker\tCCY\tQTY\tPrice'
#
# NOTE: several account references: A/C 000-000000-35 | AC name: Tan Kok Hiong
#
# Not scanned: signature. If a real instruction lives
# down there, add it by hand.

